<div class="main-content">
  <section>
    <img
      src="assets/images/Ondulacao.jpg"
      alt="Ondulação"
      class="background-image"
    />
    <div class="overlay">
      <h2>Welcome to BeaverFix</h2>
      <p>Sua vida mais simples e organizada começa aqui.</p>
      <p>
        No BeaverFix, conectamos você aos melhores profissionais de serviços
        domésticos e especializados, com praticidade, segurança e qualidade.
      </p>
    </div>
    <div class="carousel" #carousel>
      <div
        class="carousel-item"
        *ngFor="let item of carouselItems; let i = index"
      >
        <img [src]="'assets/icons/' + item.image" alt="{{ item.name }}" />
        <div class="card">{{ item.name }}</div>
      </div>
    </div>
    <div class="carousel-dots">
      <span
        *ngFor="let item of carouselItems; let i = index"
        [class.active]="i === activeIndex"
        (click)="setActiveIndex(i)"
      ></span>
    </div>
    <div class="login-container">
      <img src="assets/icons/login.jpg" alt="Login" (click)="showAlert()" />
      <p (click)="showAlert()">Login</p>
    </div>
  </section>
</div>
